<title>ROC Monument Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="gf" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cinzel:wght@400;600&family=Marcellus&family=EB+Garamond:ital@0;1&family=Libre+Baskerville:ital@0;1&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Pinyon+Script&family=Oswald:wght@500&family=Josefin+Sans:wght@400;600&family=Saira+Stencil+One&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout concept: a stonecutter's drafting bench. Step rail, option panel, and a true-scale
   drawing board where the monument is always the largest thing on screen.
   ROC brand system (green identity, dusty rose accent) carried over from the ROC site build.
   Fixed light theme on purpose: granite colors must read the same for every family. */
:root{
  --roc:#47704C; --roc-dark:#314F36; --roc-deep:#253D2B; --roc-soft:#DCE6DD; --roc-pale:#F1F5F1;
  --accent:#B5A4A9; --accent-soft:#EAE1E4; --accent-deep:#927D84;
  --surface:#FFFFFF; --bg:#FBFAF7; --sunk:#EFEEE9; --sunk-2:#E4E2DC;
  --ink:#242724; --ink-2:#535A55; --ink-3:#7A817B;
  --line:#D8D7D1; --line-2:#C9C8C1;
  --stage:#E7E6E0; --stage-ink:#5d625e;
  --warn:#8a5a1c; --warn-bg:#F6EFE3; --err:#9b2f2a; --err-bg:#F8E9E7; --ok:#47704C;
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
  --body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:8px; --hdr:60px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--roc);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);height:var(--hdr)}
.top .in{display:flex;align-items:center;gap:14px;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top img{height:38px;width:auto;display:block}
.top .ttl{display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:1px solid var(--line)}
.top .ttl b{font:500 17px/1 var(--display)}
.top .sp{flex:1}
.top .acts{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 13px;border-radius:var(--r);font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--roc);border-color:var(--roc);color:#fff}
.btn.pri:hover{background:var(--roc-dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.sitelink{background:var(--roc-pale);border-color:var(--roc-soft);color:var(--roc-deep)}
.staff{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 5px;background:var(--surface)}
.staff i{width:28px;height:16px;border-radius:9px;background:var(--line-2);position:relative;transition:.15s}
.staff i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.staff[aria-pressed="true"]{color:var(--roc-deep);border-color:var(--roc-soft);background:var(--roc-pale)}
.staff[aria-pressed="true"] i{background:var(--roc)}
.staff[aria-pressed="true"] i::after{left:14px}

/* app grid */
.app{display:grid;grid-template-columns:92px minmax(330px,390px) 1fr;height:calc(100% - var(--hdr));min-height:560px}
.rail{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:10px 4px;border-radius:var(--r);color:var(--ink-2);font-size:11.5px;font-weight:500;line-height:1.15;text-align:center;position:relative}
.rail button .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font:500 12px var(--mono);background:var(--surface)}
.rail button.done .n{border-color:var(--roc);color:var(--roc)}
.rail button[aria-current="step"]{background:var(--roc-pale);color:var(--roc-deep)}
.rail button[aria-current="step"] .n{background:var(--roc);border-color:var(--roc);color:#fff}
.rail button:hover{background:var(--sunk)}
.rail button .flag{position:absolute;top:8px;right:16px;width:8px;height:8px;border-radius:50%;background:#c58a2c}

.panel{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.pbody{flex:1;overflow-y:auto;padding:20px 18px 28px;display:flex;flex-direction:column;gap:22px}
.pbody>header h2{font-size:26px;margin-top:6px}
.pbody>header p{margin:8px 0 0;color:var(--ink-2)}
.pfoot{display:flex;gap:8px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp>.lg{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--roc-deep)}
.grp>.lg::after{content:"";flex:1;height:1px;background:var(--line)}
.grp>.lg .x{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-3)}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12px;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:14px;min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--roc);box-shadow:0 0 0 3px rgba(71,112,76,.15)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.dims3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dims3 label.f small{font:400 11px var(--mono);color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);padding:6px 11px;border-radius:20px;font-size:13px;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:3px}
.opt b{font-weight:600;font-size:13.5px}
.opt span{font-size:12px;color:var(--ink-3);line-height:1.35}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--roc);box-shadow:inset 0 0 0 1px var(--roc);background:var(--roc-pale)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sw button{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;font-size:11px;line-height:1.2;color:var(--ink-2)}
.sw button i{display:block;aspect-ratio:1;border-radius:6px;background-size:96px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);max-width:100%}
.sw button[aria-pressed="true"] i{border-color:var(--roc);box-shadow:0 0 0 2px var(--surface) inset}
.sw button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shapes button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-2)}
.shapes button svg{width:100%;height:40px}
.shapes button[aria-pressed="true"]{border-color:var(--roc);background:var(--roc-pale);color:var(--roc-deep)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fonts button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.fonts button em{font-style:normal;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.fonts button span{font-size:11px;color:var(--ink-3)}
.fonts button[aria-pressed="true"]{border-color:var(--roc);background:var(--roc-pale)}
.art{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.art button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-2);line-height:1.15;text-align:center}
.art button svg{width:42px;height:42px;color:var(--ink)}
.art button:hover{border-color:var(--roc)}
.art button small{font:400 9.5px var(--mono);color:var(--ink-3)}
.person{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.person .hd{display:flex;justify-content:space-between;align-items:center}
.person .hd b{font-size:13px}
.lines{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lines button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;text-align:left;font-size:13px}
.lines button:last-child{border-bottom:0}
.lines button[aria-pressed="true"]{background:var(--roc-pale)}
.lines button .k{font:500 11px var(--mono);color:var(--ink-3)}
.lines button .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines button .h{font:500 11.5px var(--mono);color:var(--ink-2)}
.note{border-radius:var(--r);padding:10px 12px;font-size:12.5px;line-height:1.45;background:var(--sunk);color:var(--ink-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.err{background:var(--err-bg);color:var(--err)}
.note.ok{background:var(--roc-pale);color:var(--roc-deep)}
table.spec{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.spec th,table.spec td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.spec th{font-weight:500;color:var(--ink-3);width:38%}
table.spec td{font-variant-numeric:tabular-nums}
table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:0}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:12.5px;padding:8px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.chk i{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--ok)}
.chk.warn i{background:#c58a2c}.chk.err i{background:var(--err)}.chk.info i{background:var(--accent-deep)}
.chk button{border:0;background:none;padding:0;color:var(--roc-dark);text-decoration:underline;font-size:12px}
.upload{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:14px;text-align:center;background:var(--surface);color:var(--ink-2);font-size:13px;cursor:pointer}
.upload:hover{border-color:var(--roc)}
.cbx{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.cbx input{margin-top:3px;accent-color:var(--roc)}
.sig{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);height:120px;width:100%;touch-action:none;display:block}
.est{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.est b{font:500 22px var(--display)}
.route{display:flex;flex-direction:column;gap:6px}
.route label{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12.5px}
.route label input{accent-color:var(--roc);margin-top:2px}
.route label b{display:block;font-size:13px}
.route label code{font:400 11.5px var(--mono);color:var(--ink-2);user-select:all;word-break:break-all}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qs button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;font-size:12px;font-weight:500}
.qs button svg{width:100%;height:auto;aspect-ratio:4/3;border-radius:5px;display:block}
.qs button span{padding:0 4px 3px}
.qs button:hover{border-color:var(--roc)}

/* stage */
.board{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.tools .grpb{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.tools .grpb button{border:0;background:none;padding:5px 9px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
.tools .grpb button svg{width:14px;height:14px}
.tools .grpb button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tools .grpb button[disabled]{opacity:.35}
.tools .sp{flex:1}
.zoomv{font:500 11.5px var(--mono);color:var(--ink-3);min-width:40px;text-align:center;align-self:center}
.inspector{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:9px 12px;background:var(--roc-pale);border-bottom:1px solid var(--roc-soft)}
.inspector label.f{flex:0 1 auto}
.inspector label.f>span{font-size:11px}
.inspector input,.inspector select{padding:5px 8px;font-size:13px}
.inspector .tx{flex:1 1 200px}
.inspector .nm{width:84px}
.inspector .tag{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--roc-deep);align-self:center;padding-right:4px}
.stage{flex:1;min-height:0;overflow:auto;position:relative;touch-action:none}
.stage svg.mon{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.stage .side-tag{position:absolute;left:12px;top:10px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stage-ink);background:rgba(255,255,255,.7);padding:4px 8px;border-radius:5px;pointer-events:none}
.specbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);font-size:12.5px}
.specbar .pc{display:flex;gap:5px;align-items:center}
.specbar .pc b{font-weight:600;width:52px;color:var(--ink-2)}
.specbar input{width:50px;padding:4px 5px;font:500 12.5px var(--mono);text-align:center}
.specbar select{width:auto;padding:4px 5px;font-size:12.5px}
.specbar .wt{font:500 12px var(--mono);color:var(--ink-3);min-width:62px}
.specbar .tot{margin-left:auto;font:500 12.5px var(--mono);color:var(--ink)}
.specbar .x{color:var(--ink-3);font-size:11px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(28,30,28,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:920px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal .mb{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--sunk)}
.modal .mb img{width:100%;border:1px solid var(--line);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.modal pre{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:90;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

@media (max-width:1180px){
  .app{grid-template-columns:minmax(300px,360px) 1fr;grid-template-rows:auto 1fr}
  .rail{grid-column:1/-1;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-left,0px))}
  .rail button{flex-direction:row;gap:7px;padding:7px 10px;white-space:nowrap;font-size:12.5px}
  .rail button .flag{top:6px;right:4px}
  .top .ttl{display:none}
}
@media (max-width:820px){
  :root{--hdr:56px}
  .app{display:flex;flex-direction:column;height:auto}
  .board{order:1;height:62vh;min-height:380px;position:sticky;top:var(--hdr);z-index:5}
  .rail{order:0}
  .panel{order:2;border-right:0}
  .pbody{overflow:visible}
  .top .acts .hide-m{display:none}
  .top img{height:30px}
  .specbar{display:none}
  .tools{padding:6px 10px}
  .tools .hide-m{display:none}
}
@media (max-width:480px){
  .board{height:54vh}
  .staff span{display:none}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function hexToRgb(h){h=h.replace('#','');if(h.length<6)h=h.padEnd(6,'0');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function lumOf(hex){const[r,g,b]=hexToRgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}

function star(cx,cy,R,r,n=5,rot=-90){let p=[];for(let i=0;i<n*2;i++){const a=(rot+i*180/n)*Math.PI/180,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
function petals(cx,cy,n,rx,ry,off){let s='';for(let i=0;i<n;i++)s+=`<ellipse cx="${cx}" cy="${cy-off}" rx="${rx}" ry="${ry}" transform="rotate(${i*360/n} ${cx} ${cy})"/>`;return s}

    font:'cinzel',cut:'vcut',sink:'auto',layout:'family',autoLayout:true,

let D=newDesign();
const ASSETS={}; // photo id -> {src,name,pxW,pxH}

/* history */
let HIST=[],HI=-1,histT=0;

function commit(now){clearTimeout(histT);const go=()=>{const s=snap();if(HIST[HI]===s)return;HIST=HIST.slice(0,HI+1);HIST.push(s);if(HIST.length>80)HIST.shift();HI=HIST.length-1;persist();toolsRender()};now?go():histT=setTimeout(go,350)}

/* ============================================================ inscription auto layout */
function people(){return D.people.filter(p=>p.first||p.last)}
function surname(){return D.family||people()[0]?.last||''}
function datesOf(p){if(!p.born&&!p.died)return'';return`${p.born||''} – ${p.died||''}`.trim()}
function fullName(p){return[p.first,p.middle,p.last||(D.layout==='centered'?D.family:'')].filter(Boolean).join(' ')}

function layoutSpec(){
  const P=people(),rows=[];
  const T=D.type,big=D.tablet.w;
  if(D.heading)rows.push({cols:[[{slot:'heading',text:D.heading,capH:1.25}]]});
  if(D.layout==='family'&&P.length){
    if(surname())rows.push({cols:[[{slot:'family',text:surname(),capH:big>=40?4:3.5}]]});
    for(let i=0;i<P.length;i+=3){
      rows.push({cols:P.slice(i,i+3).map((p,j)=>{const k=i+j;return[{slot:'p'+k+'n',text:[p.first,p.middle].filter(Boolean).join(' ')+(p.nick?` “${p.nick}”`:''),capH:1.5},{slot:'p'+k+'d',text:datesOf(p),capH:1.25}].filter(l=>l.text)})});
    }
  }else{
    P.forEach((p,k)=>{rows.push({cols:[[{slot:'p'+k+'n',text:fullName(p),capH:P.length>1?1.75:2.25}]]});if(p.nick)rows.push({cols:[[{slot:'p'+k+'k',text:`“${p.nick}”`,capH:1}]]});if(datesOf(p))rows.push({cols:[[{slot:'p'+k+'d',text:datesOf(p),capH:1.25}]]})});
  }

}
function autoArrange(force){
  const W=D.tablet.w,H=D.tablet.h;let Z=textZone(D.shape,W,H);
  // keep room for front art/photo placed by the user? Text zone stays the main block.
  const rows=layoutSpec();
  const existing=Object.fromEntries(D.els.filter(e=>e.slot&&e.side==='front').map(e=>[e.slot,e]));
  const want=new Set();
  if(!rows.length){D.els=D.els.filter(e=>!e.slot);return}
  // fit: width per column, then height
  const tmp=l=>({kind:'text',text:l.text,capH:l.capH,font:null,ls:null});
  rows.forEach(r=>{const cw=Z.w/r.cols.length;r.cols.forEach(c=>c.forEach(l=>{const m=textMetrics(tmp(l));if(m.w>cw*.92)l.capH=Math.max(.5,l.capH*cw*.92/m.w)}))});
  const gap=l=>l.capH*.62;
  const rowH=r=>Math.max(...r.cols.map(c=>c.reduce((a,l)=>a+l.capH+gap(l),0)));
  let tot=rows.reduce((a,r)=>a+rowH(r),0)+ (rows.length-1)*.4;
  const s=tot>Z.h?Z.h/tot:1;
  rows.forEach(r=>r.cols.forEach(c=>c.forEach(l=>l.capH=Math.max(.5,q8(l.capH*s)))));
  tot=rows.reduce((a,r)=>a+rowH(r),0)+(rows.length-1)*.4;
  let y=Z.y+(Z.h-tot)/2;
  rows.forEach(r=>{
    const rh=rowH(r),cw=Z.w/r.cols.length;
    r.cols.forEach((c,ci)=>{let yy=y+(rh-c.reduce((a,l)=>a+l.capH+gap(l),0))/2;const cx=Z.x+cw*ci+cw/2;
      c.forEach(l=>{yy+=gap(l)/2;const cy=yy+l.capH/2;yy+=l.capH+gap(l)/2;want.add(l.slot);
        const e=existing[l.slot];
        if(e){e.text=l.text;if(force||D.autoLayout){e.x=r2(cx);e.y=r2(cy);e.capH=l.capH}}
        else D.els.push({id:uid(),kind:'text',side:'front',slot:l.slot,text:l.text,capH:l.capH,x:r2(cx),y:r2(cy),font:null,cut:null,sink:null,ls:null,arc:0});
      })});
    y+=rh+.4;
  });
  D.els=D.els.filter(e=>!e.slot||e.side!=='front'||want.has(e.slot));
}

/* ============================================================ derived numbers */
const ft3=p=>p.w*p.t*p.h/1728;
const lbs=p=>Math.round(ft3(p)*CFG.DENSITY_LB_FT3);
function hasBase(){return TYPES[D.type].base&&D.base.on}
function hasSub(){return hasBase()&&D.sub.on}
function totalWeight(){return lbs(D.tablet)+(hasBase()?lbs(D.base):0)+(hasSub()?lbs(D.sub):0)}
function overallH(){return D.tablet.h+(hasBase()?D.base.h:0)+(hasSub()?D.sub.h:0)}
function footprint(){const p=hasSub()?D.sub:hasBase()?D.base:D.tablet;return{w:p.w,t:p.t}}
function foundation(){const f=footprint();return{w:f.w+8,t:f.t+8}}
function G(){return GMAP[D.granite]}
function GB(){return GMAP[D.baseGranite||D.granite]}
function sinkColor(key,dark){
  if(!key||key==='auto')key=dark?'frost':'black';
  if(key==='frost')return dark?'#d4d1ca':mix(G().base,'#ffffff',.5);
  return(SINK.find(s=>s[0]===key)||SINK[1])[2];
}
function estimate(){
  const g=G(),t=D.tablet;let L=[];
  const fin=c=>PRICE.fin[c]||1;
  L.push(['Tablet '+ftin(t.w)+' × '+ftin(t.t)+' × '+ftin(t.h)+' '+t.fin,ft3(t)*PRICE.ft3[g.tier]*fin(t.fin)]);
  if(hasBase())L.push(['Base '+D.base.fin,ft3(D.base)*PRICE.ft3[GB().tier]*PRICE.baseK*fin(D.base.fin)]);
  if(hasSub())L.push(['Sub-base',ft3(D.sub)*PRICE.ft3[GB().tier]*PRICE.subK]);
  let let$=0,laser$=0,art$=0,photo$=0;
  D.els.forEach(e=>{
    if(e.kind==='text'){const n=dispText(e).replace(/\s/g,'').length;let$+=n*(PRICE.letter[e.cut||D.cut]||8)*Math.max(1,e.capH/2)}
    else if(e.kind==='art'){const h=e.w*artAR(e);if(e.method==='laser')laser$+=Math.max(PRICE.laserMin,e.w*h*PRICE.laserSqIn);else art$+=(PRICE.art[e.method]||95)*(e.w>10?1.6:1)}
    else if(e.kind==='photo'){if(e.method==='laser')photo$+=Math.max(PRICE.photoLaserMin,e.w*e.h*PRICE.photoLaserSqIn);else photo$+=PRICE.porcelain}
    else if(e.kind==='panel')art$+=Math.max(60,e.w*e.h*.35);
  });
  if(let$)L.push(['Lettering',let$]);if(art$)L.push(['Carved art & panels',art$]);if(laser$)L.push(['Laser-etched art',laser$]);if(photo$)L.push(['Portraits',photo$]);
  if(D.vases.style!=='none')L.push([`Vases (${D.vases.sides==='both'?2:1}, ${D.vases.style})`,PRICE.vase[D.vases.style]*(D.vases.sides==='both'?2:1)]);
  const fd=foundation();L.push(['Foundation & setting',PRICE.setting+fd.w*fd.t/144*PRICE.foundationSqFt]);
  const sum=L.reduce((a,l)=>a+l[1],0);

}
function artAR(e){const a=AMAP[e.ref];return a?a.vh/a.vw:1}
function elBox(e){
  if(e.kind==='text'){const m=textMetrics(e);const pad=e.capH*.22;const arcH=e.arc?e.arc:0;return{x:e.x-m.w/2-pad,y:e.y-e.capH/2-pad-arcH,w:m.w+pad*2,h:e.capH+pad*2+arcH,m}}

}
function photoDPI(e){const a=ASSETS[e.asset];if(!a)return 0;return Math.round(Math.min(a.pxW/e.w,a.pxH/e.h))}

/* ============================================================ checks */
function checks(){
  const out=[],add=(lvl,msg,fix)=>out.push({lvl,msg,fix});const t=D.tablet,g=G(),T=TYPES[D.type];
  if(!people().length)add('err','No name entered yet.',4-1);
  if(hasBase()){
    if(D.base.w<t.w+6)add('warn',`Base is ${inch(D.base.w)} wide. Standard is at least 6″ wider than the tablet (${inch(t.w+6)}).`,2);
    if(D.base.t<t.t+4)add('warn',`Base is ${inch(D.base.t)} thick. Standard is at least 4″ deeper than the tablet (${inch(t.t+4)}).`,2);
  }
  if(hasSub()&&(D.sub.w<D.base.w+4))add('warn','Sub-base should be at least 4″ wider than the base.',2);
  const W=t.w,H=t.h;
  D.els.forEach(e=>{
    const b=elBox(e);const nm=e.kind==='text'?`“${dispText(e).slice(0,24)}”`:e.kind==='art'?(AMAP[e.ref]?.name||'Artwork'):e.kind==='photo'?'Portrait':'Panel';
    if(b.x<.75||b.y<.5||b.x+b.w>W-.75||b.y+b.h>H-.5)add('err',`${nm} runs past the safe edge of the ${e.side} face.`,{sel:e.id});
    if(e.kind==='text'&&e.capH<.5)add('err',`${nm} is ${inch(e.capH)} tall. Sandblast lettering needs at least ½″.`,{sel:e.id});
    else if(e.kind==='text'&&e.capH<.75&&(e.cut||D.cut)!=='laser')add('warn',`${nm} is ${inch(e.capH)} tall. Under ¾″ is hard to read at the grave.`,{sel:e.id});
    const laser=(e.kind==='text'&&(e.cut||D.cut)==='laser')||(e.method==='laser');
    if(laser&&g.laser==='Not recommended')add('err',`${nm} is laser etched, but ${g.name} is too light for laser work. Use black granite or switch to sandblast.`,{sel:e.id});
    if(e.kind==='photo'){const dpi=photoDPI(e);if(!e.asset)add('warn','Portrait placeholder: the photo still needs to be uploaded.',{sel:e.id});else if(dpi<120)add('err',`Portrait photo is ${dpi} dpi at ${e.w}×${e.h}″. Laser etching needs 200+ dpi. Upload a larger scan or reduce the size.`,{sel:e.id});else if(dpi<200)add('warn',`Portrait photo is ${dpi} dpi at this size. 250 dpi or more gives the best etch.`,{sel:e.id})}
  });
  ['front','back'].forEach(sd=>{const L=D.els.filter(e=>e.side===sd&&e.kind!=='panel');for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=elBox(L[i]),b=elBox(L[j]);const ix=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),iy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);if(ix>0&&iy>0&&ix*iy>.12*Math.min(a.w*a.h,b.w*b.h)){const nm=e=>e.kind==='text'?`“${dispText(e).slice(0,18)}”`:e.kind==='art'?AMAP[e.ref]?.name:'Portrait';add('warn',`${nm(L[i])} and ${nm(L[j])} overlap on the ${sd}.`,{sel:L[j].id})}}});
  if(D.els.some(e=>e.side==='back')&&['P1','PFS'].includes(t.fin))add('warn',`Back has carving but the ${t.fin} finish leaves the back unpolished. Switch the tablet to P2, P3 or P5.`,2);
  if(D.vases.style!=='none'){if(!hasBase())add('err','Vases need a base to sit on.',2);else if((D.base.w-t.w)/2<8)add('warn',`Vases need about 8″ of base on each side. There is ${inch((D.base.w-t.w)/2)} now; widen the base to ${inch(t.w+16)}.`,2)}
  people().forEach(p=>{const b=parseInt(String(p.born).match(/\d{4}/)?.[0]),d=parseInt(String(p.died).match(/\d{4}/)?.[0]);if(b&&d&&d<b)add('err',`${p.first}: date of death is before date of birth.`,4-1)});
  const c=CEMETERIES.find(x=>x.id===D.cem.id);
  if(c){if(!c.types.includes(D.type))add('err',`${c.name} does not allow ${T.label.toLowerCase()} memorials (demo rules).`,0);
    if(footprint().w>c.maxW)add('err',`${c.name} allows up to ${inch(c.maxW)} wide. This design is ${inch(footprint().w)} at the bottom.`,2);
    if(overallH()>c.maxH)add('warn',`${c.name} limits height to ${inch(c.maxH)}. This design stands ${inch(overallH())}.`,2)}
  if(totalWeight()>3000)add('info',`Total weight ${totalWeight().toLocaleString()} lbs. Setting crew will need a boom truck.`);
  if(!out.some(o=>o.lvl!=='info'))add('ok','Design passes every production check.');
  return out;
}

/* ============================================================ rendering */
let RID=0;

  }

  }

  // elements
  const els=o.blank?[]:D.els.filter(e=>e.side===side);
  els.forEach((e,i)=>{tab+=drawEl(e,{shop,dark,id,inter,num:o.numbers?(D.els.filter(x=>x.side===side).indexOf(e)+1):0,fsz,hilite:o.hilite})});
  // selection
  if(inter&&UI.sel){const e=D.els.find(x=>x.id===UI.sel&&x.side===side);if(e){const bb=elBox(e);const hs=fsz*.45;
    tab+=`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="none" stroke="#c79a52" stroke-width="${fsz*.06}" stroke-dasharray="${fsz*.3} ${fsz*.2}" pointer-events="none"/>`;
    tab+=`<rect data-h="resize" x="${bb.x+bb.w-hs}" y="${bb.y+bb.h-hs}" width="${hs*2}" height="${hs*2}" rx="${hs*.3}" fill="#fff" stroke="#c79a52" stroke-width="${fsz*.07}" style="cursor:nwse-resize"/>`;
    if(UI.dims){tab+=`<g font-family="IBM Plex Mono, monospace" font-size="${fsz*.75}" fill="#c79a52" pointer-events="none"><line x1="0" y1="${e.y}" x2="${bb.x}" y2="${e.y}" stroke="#c79a52" stroke-width="${fsz*.04}" stroke-dasharray="${fsz*.2} ${fsz*.15}"/><text x="${bb.x/2}" y="${e.y-fsz*.3}" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="${fsz*.25}">${inch(bb.x)}</text><line x1="${e.x}" y1="0" x2="${e.x}" y2="${bb.y}" stroke="#c79a52" stroke-width="${fsz*.04}" stroke-dasharray="${fsz*.2} ${fsz*.15}"/><text x="${e.x+fsz*.3}" y="${bb.y/2+fsz*.3}" paint-order="stroke" stroke="#fff" stroke-width="${fsz*.25}">${inch(bb.y)}</text></g>`}
  }}

    for(let i=0;i<=t.w;i++){const L=i%12===0?1:i%6===0?.7:.35;R+=`<line x1="${tx+i}" y1="${ry}" x2="${tx+i}" y2="${ry-fsz*1.1*L}" stroke="#5d625e" stroke-width="${fsz*.035}"/>`;if(i%6===0)R+=`<text x="${tx+i+fsz*.12}" y="${ry-fsz*.45}" font-size="${fsz*.55}" fill="#3a3d3b">${i}</text>`}
    R+=`<rect x="${rx-fsz*1.1}" y="${tabTop}" width="${fsz*1.1}" height="${t.h}" fill="#fff" fill-opacity=".85" stroke="#9aa09b" stroke-width="${fsz*.03}"/>`;
    for(let i=0;i<=t.h;i++){const L=i%12===0?1:i%6===0?.7:.35;R+=`<line x1="${rx}" y1="${tabTop+i}" x2="${rx-fsz*1.1*L}" y2="${tabTop+i}" stroke="#5d625e" stroke-width="${fsz*.035}"/>`;if(i%6===0&&i)R+=`<text x="${rx-fsz*1.05}" y="${tabTop+i-fsz*.15}" font-size="${fsz*.55}" fill="#3a3d3b">${i}</text>`}

function drawEl(e,o){
  const {shop,dark,id,inter}=o;
  const cut=e.kind==='text'?(e.cut||D.cut):e.method;
  const col=shop?'#111':cut==='laser'?'#d9d8d3':sinkColor(e.sink||D.sink,dark);
  const lit=shop?null:mix(G().base,'#ffffff',dark?.25:.55), sha=shop?null:mix(G().base,'#000000',.5);
  const hl=o.hilite&&o.hilite!==cut&&!(o.hilite==='laser'&&e.kind==='photo'&&e.method==='laser');
  let s='';const da=inter?`data-id="${e.id}" style="cursor:move"`:'';
  const op=hl?' opacity=".22"':'';
  if(e.kind==='text'){
    const f=fontOf(e),m=textMetrics(e),fs=m.fs,ls=lsOf(e)*fs,tx=dispText(e);
    const base=e.y+e.capH/2;
    const st=`font-family:${f.css.replace(/'/g,'&#39;').replace(/"/g,'&quot;')};font-size:${fs.toFixed(3)}px;letter-spacing:${ls.toFixed(3)}px;${e.it?'font-style:italic;':''}`;
    const lay=(dx,dy,fill,extra='')=>{
      if(e.arc){const half=m.w/2+fs*.4,k=e.arc;const p=`M${e.x-half+dx} ${base+dy}Q${e.x+dx} ${base-2*k+dy} ${e.x+half+dx} ${base+dy}`;const pid=`ap${id}${e.id}${dx}`.replace(/\./g,'');return`<path id="${pid}" d="${p}" fill="none"/><text style="${st}" fill="${fill}" ${extra}><textPath href="#${pid}" startOffset="50%" text-anchor="middle">${esc(tx)}</textPath></text>`}
      return`<text x="${(e.x+ls/2+dx).toFixed(3)}" y="${(base+dy).toFixed(3)}" text-anchor="middle" style="${st}" fill="${fill}" ${extra}>${esc(tx)}</text>`};
    if(shop)s+=lay(0,0,'#111');
    else if(cut==='vcut'){s+=lay(-fs*.025,-fs*.03,sha)+lay(fs*.025,fs*.03,lit)+lay(0,0,col)}
    else if(cut==='raised'){s+=lay(fs*.05,fs*.06,'rgba(0,0,0,.45)')+lay(0,0,mix(G().base,'#ffffff',.12))+lay(-fs*.012,-fs*.012,'none',`stroke="${lit}" stroke-width="${fs*.012}"`)}
    else if(cut==='polish'){const bb=elBox(e);s+=`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="${col}" opacity=".85"/>`+lay(0,0,G().base)+lay(0,0,`url(#gp${id})`)}
    else if(cut==='laser')s+=lay(0,0,col,'opacity=".92"');
    else s+=lay(fs*.012,fs*.015,'rgba(0,0,0,.35)')+lay(0,0,col);
    const bb=elBox(e);
    return`<g ${da}${op}>${s}${inter?`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="transparent"/>`:''}${o.num?numTag(o.num,bb,o.fsz):''}</g>`;
  }
  if(e.kind==='art'){
    const a=AMAP[e.ref];if(!a)return'';const sc=e.w/a.vw,h=e.w*artAR(e);
    const fill=shop?'#111':col;
    const inner=`<g transform="translate(${-a.vx-a.vw/2} ${-a.vy-a.vh/2})" fill="currentColor">${a.svg}</g>`;
    if(!shop&&cut==='shape')s+=`<g transform="translate(${e.x+e.w*.006} ${e.y+e.w*.008}) rotate(${e.rot||0}) scale(${(e.flip?-sc:sc).toFixed(5)} ${sc.toFixed(5)})" style="color:${sha}">${inner}</g>`;
    s+=`<g transform="translate(${e.x} ${e.y}) rotate(${e.rot||0}) scale(${(e.flip?-sc:sc).toFixed(5)} ${sc.toFixed(5)})" style="color:${fill}" ${cut==='laser'&&!shop?'opacity=".78"':''}>${inner}</g>`;
    const bb=elBox(e);
    return`<g ${da}${op}>${s}${inter?`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="transparent"/>`:''}${o.num?numTag(o.num,bb,o.fsz):''}</g>`;
  }
  if(e.kind==='photo'){
    const x=e.x-e.w/2,y=e.y-e.h/2,A=ASSETS[e.asset];
    const clip=e.shape==='oval'?`<ellipse cx="${e.x}" cy="${e.y}" rx="${e.w/2}" ry="${e.h/2}"/>`:`<rect x="${x}" y="${y}" width="${e.w}" height="${e.h}" rx="${Math.min(e.w,e.h)*.03}"/>`;
    const cid=`pc${id}${e.id}`;
    if(shop){s+=`<g fill="none" stroke="#111" stroke-width="${o.fsz*.06}" stroke-dasharray="${o.fsz*.3} ${o.fsz*.2}">${clip}</g><text x="${e.x}" y="${e.y}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="${Math.min(e.w*.11,o.fsz*.8)}" fill="#111">${e.method==='laser'?'LASER':'PORCELAIN'} ${fmtN(e.w)}×${fmtN(e.h)}″</text>`}
    else{
      if(e.method!=='laser')s+=e.shape==='oval'?`<ellipse cx="${e.x}" cy="${e.y}" rx="${e.w/2+.35}" ry="${e.h/2+.35}" fill="#9a7a45"/>`:`<rect x="${x-.35}" y="${y-.35}" width="${e.w+.7}" height="${e.h+.7}" rx=".3" fill="#9a7a45"/>`;
      s+=`<clipPath id="${cid}">${clip}</clipPath><g clip-path="url(#${cid})">`;
      if(A)s+=`<image href="${A.src}" x="${x}" y="${y}" width="${e.w}" height="${e.h}" preserveAspectRatio="xMidYMid slice" ${e.method==='laser'||e.method==='porcelain-bw'?`filter="url(#mono${id})"`:''} ${e.method==='laser'?'style="mix-blend-mode:screen" opacity=".92"':''}/>`;
      else s+=`<rect x="${x}" y="${y}" width="${e.w}" height="${e.h}" fill="${e.method==='laser'?'rgba(255,255,255,.08)':'#efe9df'}"/><g fill="${e.method==='laser'?'#d8d6d0':'#b9b2a6'}" opacity=".7"><circle cx="${e.x}" cy="${e.y-e.h*.12}" r="${e.w*.2}"/><path d="M${e.x-e.w*.42} ${e.y+e.h*.5}C${e.x-e.w*.4} ${e.y+e.h*.12} ${e.x-e.w*.2} ${e.y+e.h*.06} ${e.x} ${e.y+e.h*.06}S${e.x+e.w*.4} ${e.y+e.h*.12} ${e.x+e.w*.42} ${e.y+e.h*.5}Z"/></g>`;
      s+=`</g>`;
      if(e.method==='laser'&&A)s+=`<g clip-path="url(#${cid})"><rect x="${x}" y="${y}" width="${e.w}" height="${e.h}" fill="none" stroke="${G().base}" stroke-width="${Math.min(e.w,e.h)*.12}" opacity=".85" filter="blur(0px)"/></g>`;
    }
    const bb=elBox(e);
    return`<g ${da}${op}>${s}${inter?`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="transparent"/>`:''}${o.num?numTag(o.num,bb,o.fsz):''}</g>`;
  }
  if(e.kind==='panel'){
    const x=e.x-e.w/2,y=e.y-e.h/2;
    const shp=e.shape==='oval'?`<ellipse cx="${e.x}" cy="${e.y}" rx="${e.w/2}" ry="${e.h/2}"`:e.shape==='arch'?`<path d="M${x} ${y+e.h}V${y+e.w*.3}A${e.w/2} ${e.w*.3} 0 0 1 ${x+e.w} ${y+e.w*.3}V${y+e.h}Z"`:`<rect x="${x}" y="${y}" width="${e.w}" height="${e.h}" rx="${Math.min(e.w,e.h)*.04}"`;
    if(shop)s+=`${shp} fill="none" stroke="#111" stroke-width="${o.fsz*.05}"/>`;
    else{const pf=e.finish==='steeled'?'#fff':sinkColor(e.sink||'frost',dark);s+=`${shp} fill="${pf}" opacity="${e.finish==='steeled'?.28:dark?.32:.4}"/>`+`${shp} fill="none" stroke="${sha}" stroke-width=".08" opacity=".7"/>`}
    const bb=elBox(e);
    return`<g ${da}${op}>${s}${o.num?numTag(o.num,bb,o.fsz):''}</g>`;
  }
  return'';
}
function numTag(n,bb,fsz){const r=fsz*.55;const x=bb.x-r*.4,y=bb.y-r*.4;return`<g pointer-events="none"><circle cx="${x}" cy="${y}" r="${r}" fill="#47704C"/><text x="${x}" y="${y+r*.36}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="${r*1.05}" fill="#fff">${n}</text></g>`}

/* side elevation for the supplier: shows thicknesses */
function sideElevation(){
  const t=D.tablet,b=D.base,s=D.sub,HB=hasBase(),HS=hasSub();
  const sh=HS?s.h:0,bh=HB?b.h:0;
  const TD=Math.max(t.t,HB?b.t:0,HS?s.t:0),H=overallH();
  const fsz=clamp(Math.max(TD,H)*.035,.7,1.6);
  const vb=[-TD/2-fsz*2.5,-H-fsz*2.5,TD+fsz*8,H+fsz*5];
  const L=`fill="none" stroke="#111" stroke-width="${fsz*.07}"`;
  let S=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#fff"/>`;
  if(HS)S+=`<rect x="${-s.t/2}" y="${-sh}" width="${s.t}" height="${sh}" ${L}/>`;
  if(HB)S+=`<rect x="${-b.t/2}" y="${-sh-bh}" width="${b.t}" height="${bh}" ${L}/>`;
  const slant=D.type==='slant';
  S+=slant?`<path d="M${-t.t/2} ${-sh-bh}V${-H+1.5}L${-t.t/2+2} ${-H}H${t.t/2}V${-sh-bh}Z" ${L}/>`:`<rect x="${-t.t/2}" y="${-H}" width="${t.t}" height="${t.h}" ${L}/>`;
  const c='#111',sw=fsz*.045;
  const dH=(x1,x2,y,lab)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${c}" stroke-width="${sw}"/><text x="${(x1+x2)/2}" y="${y-fsz*.3}" text-anchor="middle" font-size="${fsz*.7}">${lab}</text>`;
  S+=`<g font-family="IBM Plex Mono, monospace" fill="#111">${dH(-t.t/2,t.t/2,-H-fsz*.8,ftin(t.t))}${HB?dH(-b.t/2,b.t/2,fsz*1.3,ftin(b.t)):''}${HS?dH(-s.t/2,s.t/2,fsz*2.6,ftin(s.t)):''}<text x="${TD/2+fsz*.6}" y="${-H/2}" font-size="${fsz*.7}">SIDE</text></g>`;
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.map(fmtN).join(' ')}">${S}</svg>`;
}

/* true-size face export for stencil/laser software */
function faceSVG(side){
  const t=D.tablet,els=D.els.filter(e=>e.side===side);
  let s=`<path d="${shapePath(D.shape,t.w,t.h)}" fill="none" stroke="#000" stroke-width="0.02"/>`;
  els.forEach(e=>{s+=drawEl(e,{shop:true,dark:false,id:'x',inter:false,fsz:1})});
  return`<?xml version="1.0" encoding="UTF-8"?>\n<!-- ${CFG.brand} · ${D.id||'draft'} · ${side} face · 1 unit = 1 inch · ${t.w}″ × ${t.h}″ -->\n<svg xmlns="http://www.w3.org/2000/svg" width="${t.w}in" height="${t.h}in" viewBox="0 0 ${t.w} ${t.h}">${s}</svg>`;
}

/* ============================================================ stage + interaction */
function stageRender(){
  const st=$('#stage');
  st.innerHTML=renderStone({interactive:true,side:UI.side,cls:'mon'})+`<span class="side-tag">${UI.side==='front'?'Front':'Back'} · ${D.tablet.w}″ × ${D.tablet.h}″ tablet</span>`;
  const svg=st.querySelector('svg');
  if(UI.zoom!==1){svg.style.width=(UI.zoom*100)+'%';svg.style.height=(UI.zoom*100)+'%'}
}
function svgPt(ev){const svg=$('#stage svg');const tab=svg.querySelector('#tab');const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(tab.getScreenCTM().inverse())}
function bindStage(){
  const st=$('#stage');
  st.addEventListener('pointerdown',ev=>{
    const h=ev.target.closest('[data-h]'),g=ev.target.closest('[data-id]');
    if(h&&UI.sel){const e=D.els.find(x=>x.id===UI.sel);const p=svgPt(ev);UI.drag={mode:'resize',id:e.id,cx:e.x,cy:e.y,d0:Math.hypot(p.x-e.x,p.y-e.y),w0:e.kind==='text'?e.capH:e.w,h0:e.h};st.setPointerCapture(ev.pointerId);ev.preventDefault();return}
    if(g){const e=D.els.find(x=>x.id===g.dataset.id);if(!e)return;UI.sel=e.id;const p=svgPt(ev);UI.drag={mode:'move',id:e.id,dx:p.x-e.x,dy:p.y-e.y,moved:false};st.setPointerCapture(ev.pointerId);inspRender();stageRender();ev.preventDefault();return}
    if(UI.sel){UI.sel=null;inspRender();stageRender();if(UI.step===3)panelRender()}
  });
  st.addEventListener('pointermove',ev=>{
    const d=UI.drag;if(!d)return;const e=D.els.find(x=>x.id===d.id);if(!e)return;const p=svgPt(ev);
    if(d.mode==='move'){let nx=p.x-d.dx,ny=p.y-d.dy;d.snapX=Math.abs(nx-D.tablet.w/2)<.4;if(d.snapX)nx=D.tablet.w/2;e.x=r2(q8(nx));e.y=r2(q8(ny));d.moved=true;if(e.slot)D.autoLayout=false}
    else{const k=Math.hypot(p.x-d.cx,p.y-d.cy)/Math.max(.1,d.d0);if(e.kind==='text'){e.capH=clamp(q8(d.w0*k),.375,12)}else{e.w=clamp(r2(d.w0*k),.75,D.tablet.w*1.2);if(e.kind!=='art')e.h=clamp(r2(d.h0*k),.75,D.tablet.h*1.2)}if(e.slot)D.autoLayout=false}
    stageRender();inspSync();
  });
  const end=()=>{if(UI.drag){UI.drag=null;commit(true);stageRender();specRender();if([3,4,5].includes(UI.step))panelRender()}};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('wheel',ev=>{if(!ev.ctrlKey&&!ev.metaKey)return;ev.preventDefault();setZoom(UI.zoom*(ev.deltaY<0?1.15:1/1.15))},{passive:false});
  document.addEventListener('keydown',ev=>{
    const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
    if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}

function applyPreset(p,keepNames=true){
  const d=p.d;const keep={family:D.family,people:D.people,heading:D.heading,epitaph:D.epitaph,contact:D.contact,cem:D.cem};
  D={...newDesign(),...keep,type:d.type,who:d.who,granite:d.granite,shape:d.shape,tablet:{...d.tablet},base:{...d.base},layout:d.layout,font:d.font,cut:d.cut,sink:d.sink,autoLayout:true,els:[]};
  if(d.people===1&&D.people.length>1)D.people=D.people.slice(0,1);
  if(d.people!==1&&D.people.length<2)D.people.push({...blankPerson(),first:'Mary',middle:'Elizabeth',born:'1945'});
  autoArrange(true);
  d.art.forEach(([ref,w,fx,fy,m])=>{const ar=AMAP[ref].vh/AMAP[ref].vw;const ww=Math.min(w,D.tablet.h*.4/ar);const hh=ww*ar;D.els.push({id:uid(),kind:'art',side:'front',ref,w:r2(ww),x:r2(D.tablet.w*fx),y:r2(Math.max(D.tablet.h*fy,1+hh/2)),rot:0,flip:false,method:m||'blast',sink:null})});

  if(d.art.length){const top=Math.max(...D.els.filter(e=>e.kind==='art').map(e=>elBox(e).y+elBox(e).h));const tx=D.els.filter(e=>e.kind==='text');const minY=Math.min(...tx.map(e=>elBox(e).y));if(minY<top+.5){const avail=D.tablet.h-1.5-(top+.6);const used=Math.max(...tx.map(e=>elBox(e).y+elBox(e).h))-minY;const k=Math.min(1,avail/used);tx.forEach(e=>{e.y=r2(top+.6+(elBox(e).y-minY)*k+(e.y-elBox(e).y)*k);e.capH=Math.max(.5,q8(e.capH*k))})}}
}

function specTable(){
  const t=D.tablet,b=D.base,s=D.sub,T=TYPES[D.type],g=G();
  const rows=[['Memorial',`${T.label} · ${SHAPES[D.shape]}`],['Granite',g.name+(hasBase()&&D.baseGranite?` · base ${GB().name}`:'')],
    ['Tablet',`${ftin(t.w)} × ${ftin(t.t)} × ${ftin(t.h)} · ${t.fin} (${FINDESC[t.fin]})`]];
  if(hasBase())rows.push(['Base',`${ftin(b.w)} × ${ftin(b.t)} × ${ftin(b.h)} · ${b.fin} (${FINDESC[b.fin]})`]);
  if(hasSub())rows.push(['Sub base',`${ftin(s.w)} × ${ftin(s.t)} × ${ftin(s.h)} · ${FINDESC[s.fin]||s.fin}`]);
  rows.push(['Weight',`${totalWeight().toLocaleString()} lbs total`],['Lettering',`${FMAP[D.font].name} · ${CUTMAP[D.cut]} · ${SINK.find(x=>x[0]===D.sink)[1]} sinkage`],
    ['Artwork',D.els.filter(e=>e.kind==='art').map(e=>`${AMAP[e.ref]?.name} (${inch(e.w)})`).join(', ')||'None'],
    ['Portrait',D.els.filter(e=>e.kind==='photo').map(e=>`${e.method==='laser'?'Laser':'Porcelain'} ${e.w}×${e.h}″`).join(', ')||'None'],
    ['Vases',D.vases.style==='none'?'None':`${D.vases.style} · ${D.vases.sides}`],['Back',D.els.some(e=>e.side==='back')?`${D.els.filter(e=>e.side==='back').length} items`:'Plain'],
    ['Cemetery',cemName()||'Not chosen']);
  return`<table class="spec">${rows.map(r=>`<tr><th>${r[0]}</th><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
}

/* signature pad */
function bindSig(){
  const c=$('#sig');if(!c)return;const x=c.getContext('2d');x.lineWidth=3;x.lineCap='round';x.strokeStyle='#1d2b4f';
  if(D.approval.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=D.approval.sig}
  let on=false,last=null;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{on=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!on)return;const p=pt(e);x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p};
  c.onpointerup=()=>{if(!on)return;on=false;D.approval.sig=c.toDataURL('image/png');D.approval.date=new Date().toLocaleDateString();commit(true)};
}

let PHOTO_TARGET=null,PHOTO_SIZE=PHOTO_SIZES[2];
function bindPanel(){
  const pb=$('#pbody');
  pb.addEventListener('input',ev=>{
    const t=ev.target;
    if(t.id==='artQ'){UI.artQ=t.value;const pos=t.selectionStart;panelRender();const n=$('#artQ');n.focus();n.setSelectionRange(pos,pos);return}
    if(t.id==='backNames'){D.backNames=t.value;return}
    const p=t.dataset.bind;if(!p)return;
    let v=t.dataset.num?parseFloat(t.value):t.value;if(t.dataset.num&&!(v>0))return;
    setPath(p,v);
    if(t.dataset.num){const sm=t.parentElement.querySelector('small');if(sm)sm.textContent=ftin(v)}
    afterChange(p,false);
  });
  pb.addEventListener('change',ev=>{
    const t=ev.target;
    if(t.dataset.chk){D.approval.checks[t.dataset.chk]=t.checked;commit(true);return}
    if(t.dataset.route){D.route[t.dataset.route]=t.checked;commit(true);return}
    if(t.tagName==='SELECT'&&t.dataset.bind){setPath(t.dataset.bind,t.value);afterChange(t.dataset.bind,true)}
  });
  pb.addEventListener('click',ev=>{
    const b=ev.target.closest('button,[data-upload]');if(!b)return;const d=b.dataset;
    if(d.set!==undefined){let v=d.v;if(['base.on','sub.on','urn'].includes(d.set))v=v==='1';setPath(d.set,v);afterChange(d.set,true);return}
    if(d.preset){applyPreset(PRESETS[+d.preset]);commit(true);renderAll();toast('Design loaded. Your names were kept.');return}
    if(d.gfam){UI.gfam=d.gfam;panelRender();return}
    if(d.size){const z=TYPES[D.type].sizes[+d.size];D.tablet={...D.tablet,w:z[1],t:z[2],h:z[3]};if(z[4])D.base={...D.base,w:z[4],t:z[5],h:z[6]};afterChange('tablet',true);return}
    if(d.fitbase){D.base.w=D.tablet.w+12;D.base.t=D.tablet.t+6;afterChange('base',true);return}
    if(d.auto){D.autoLayout=true;autoArrange(true);commit(true);renderAll();return}
    if(d.addp){D.people.push(blankPerson());afterChange('people',true);return}
    if(d.rmp){D.people.splice(+d.rmp,1);afterChange('people',true);return}
    if(d.sel){UI.sel=d.sel;UI.side=D.els.find(e=>e.id===d.sel)?.side||UI.side;inspRender();stageRender();panelRender();return}
    if(d.addtext){const side=d.addtext;const e={id:uid(),kind:'text',side,slot:null,text:side==='back'?'Second inscription':'New line',capH:1.25,x:D.tablet.w/2,y:D.tablet.h*.5,font:null,cut:null,sink:null,ls:null,arc:0};D.els.push(e);UI.sel=e.id;UI.side=side;commit(true);renderAll();setTimeout(()=>{const n=$('#i-text');n&&(n.focus(),n.select())},30);return}
    if(d.acat){UI.artCat=d.acat;UI.artQ='';panelRender();return}
    if(d.artm){UI.artMethod=d.artm;panelRender();return}
    if(d.addart){addArt(d.addart);return}
    if(d.psize){PHOTO_SIZE=PHOTO_SIZES[+d.psize];PHOTO_TARGET=null;$('#photoIn').click();return}
    if(d.upload){PHOTO_SIZE=PHOTO_SIZE||PHOTO_SIZES[2];PHOTO_TARGET=null;$('#photoIn').click();return}
    if(d.panel){const w=Math.min(D.tablet.w*.6,24),h=d.panel==='rect'?D.tablet.h*.3:D.tablet.h*.45;const e={id:uid(),kind:'panel',side:UI.side,shape:d.panel,w:r2(w),h:r2(h),x:D.tablet.w/2,y:D.tablet.h*.55,finish:'frost',sink:null};D.els.unshift(e);UI.sel=e.id;commit(true);renderAll();return}
    if(d.back){backPreset(d.back);return}
    if(d.backnames){const names=(D.backNames||'').split('\n').map(s=>s.trim()).filter(Boolean);if(!names.length)return toast('Type at least one name.');D.els=D.els.filter(e=>!(e.side==='back'&&e.slot&&e.slot.startsWith('bk')));const W=D.tablet.w,H=D.tablet.h;const cap=Math.min(1.5,(H*.55)/(names.length*1.7+1.5));D.els.push({id:uid(),kind:'text',side:'back',slot:'bkh',text:'Children',capH:q8(cap*1.1),x:W/2,y:H*.25,font:null,cut:null,sink:null,ls:null,arc:0});names.forEach((n,i)=>D.els.push({id:uid(),kind:'text',side:'back',slot:'bk'+i,text:n,capH:q8(cap),x:W/2,y:r2(H*.25+cap*2.2+i*cap*1.7),font:null,cut:null,sink:null,ls:null,arc:0}));UI.side='back';commit(true);renderAll();return}
    if(d.goart){UI.side='back';goStep(4);UI.side='back';renderAll();toast('Art you add now goes on the back.');return}
    if(d.fix){const f=JSON.parse(d.fix);if(typeof f==='number')goStep(f);else if(f.sel){const e=D.els.find(x=>x.id===f.sel);UI.side=e?.side||'front';UI.sel=f.sel;goStep(e?.side==='back'?5:e?.kind==='text'?3:4);UI.side=e?.side||'front';UI.sel=f.sel;inspRender();stageRender()}return}
    if(d.proof){buildPDF('proof');return}
    if(d.workorder){buildPDF('work');return}
    if(d.svg){download(`${D.id||'ROC-draft'}-${d.svg}-face-1to1.svg`,new Blob([faceSVG(d.svg)],{type:'image/svg+xml'}));return}
    if(d.json){saveFile();return}
    if(d.copy){copyText(workOrderText());return}
    if(d.mail){mailProduction();return}
    if(d.send){sendToROC();return}
    if(d.clearsig){D.approval.sig='';commit(true);const c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);return}
  });
}
function afterChange(path,rerenderPanel){
  if(path==='type'){const T=TYPES[D.type];if(!T.shapes.includes(D.shape))D.shape=T.shapes[0];const z=T.sizes[Math.min(1,T.sizes.length-1)];D.tablet={...D.tablet,w:z[1],t:z[2],h:z[3]};if(z[4])D.base={...D.base,on:true,w:z[4],t:z[5],h:z[6]};if(D.type==='pet'){D.who='pet'}if(['flat','bevel','pet'].includes(D.type))D.vases.style='none'}
  if(path==='who'){if(D.who==='individual'&&D.people.length>1)D.people=D.people.slice(0,1);if((D.who==='companion'||D.who==='family')&&D.people.length<2)D.people.push(blankPerson());D.layout=D.who==='individual'||D.who==='pet'?'centered':'family'}
  const relayout=/^(family|people|heading|epitaph|layout|font|shape|tablet|type|who)/.test(path);
  if(relayout)autoArrange(path==='layout'||path==='shape'||path.startsWith('tablet.w')||path.startsWith('tablet.h')||path==='type'||path==='font');
  commit(!rerenderPanel?false:true);
  stageRender();specRender();railRender();inspRender();
  if(rerenderPanel)panelRender();
  else if(path.startsWith('people')||path==='family'){const l=$('#pbody .lines');if(l){const tl=D.els.filter(e=>e.kind==='text'&&e.side==='front');l.innerHTML=tl.map((e,i)=>`<button data-sel="${e.id}"><span class="k">${i+1}</span><span class="t">${esc(dispText(e))}</span><span class="h">${inch(e.capH)}</span></button>`).join('')}}
}
function addArt(ref){
  const a=AMAP[ref];const W=D.tablet.w,H=D.tablet.h;const scene=a.cat==='Scenes';
  const w=scene?Math.min(W*.7,H*.38/(a.vh/a.vw)):Math.min(W*.18,6);
  const m=UI.artMethod||(scene&&G().laser!=='Not recommended'?'laser':'blast');

/* SVG → PNG with embedded web fonts so lettering renders in exports */
let FONTCSS=null;
async function fontCSS(){
  if(FONTCSS!==null)return FONTCSS;
  try{
    const href=$('#gf').href;const css=await (await fetch(href)).text();
    const blocks=css.split('/* ').filter(b=>b.startsWith('latin */'));
    const out=[];
    for(const b of blocks){const m=b.match(/url\((https:[^)]+)\)/);if(!m)continue;const r=await fetch(m[1]);const buf=await r.arrayBuffer();let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
      out.push(b.slice(b.indexOf('@font-face')).replace(m[1],'data:font/woff2;base64,'+btoa(bin)).replace(/unicode-range:[^;]+;/,''))}
    FONTCSS=out.join('\n');
  }catch(e){FONTCSS=''}
  return FONTCSS;
}
async function svgToPng(svg,pxW){
  const css=await fontCSS();
  if(css)svg=svg.replace(/<defs>/,`<defs><style>${css}</style>`);
  return new Promise(res=>{const m=svg.match(/viewBox="([^"]+)"/);const v=m[1].split(' ').map(Number);const H=Math.round(pxW*v[3]/v[2]);
    svg=svg.replace('<svg ',`<svg width="${pxW}" height="${H}" `);
    const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    img.onload=()=>{const c=document.createElement('canvas');c.width=pxW;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pxW,H);x.drawImage(img,0,0,pxW,H);URL.revokeObjectURL(url);res({src:c.toDataURL('image/jpeg',.9),w:pxW,h:H})};
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url});
}

        const bb=elBox(e);let thumb=null;
        if(e.kind==='photo'&&e.asset)thumb=ASSETS[e.asset].src;
        else if(e.kind==='art'){const a=AMAP[e.ref];const p=await svgToPng(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${a.vb}"><defs></defs><g fill="#111">${a.svg}</g></svg>`,400);thumb=p&&p.src}
        if(thumb){try{doc.addImage(thumb,'JPEG',M,y,110,110*(bb.h/bb.w)>140?140:110*(bb.h/bb.w))}catch(err){}}
        const rows=[['Item',e.kind==='photo'?'Laser-etched portrait':e.kind==='art'?`${e.ref} ${AMAP[e.ref]?.name}`:`Text: ${dispText(e)}`],['Side',e.side],['Etch size',`${r2(bb.w)}" wide × ${r2(bb.h)}" tall${e.kind==='photo'?' ('+e.shape+')':''}`],['Position (center)',`x ${r2(e.x)}" from left · y ${r2(e.y)}" from top`],['Granite',`${g.name} (${g.laser} for laser)`]];
        if(e.kind==='photo')rows.push(['Source file',e.asset?`${ASSETS[e.asset].name} · ${ASSETS[e.asset].pxW}×${ASSETS[e.asset].pxH}px · ${photoDPI(e)} dpi at size`:'PHOTO NOT YET RECEIVED']);
        if(e.flip)rows.push(['Orientation','Mirrored']);
        const yy=table(M+124,y,[['',100],['',PW-2*M-124-100]],rows,{fs:8});
        y=Math.max(yy,y+150)+8;
      }
      doc.setFontSize(7.5);doc.setTextColor(...soft);doc.text('Full-resolution photos are sent with this order. True-size SVG layout available from ROC.',M,PH-40);
      foot();
    }
  }
  Object.assign(UI,saveUI);
  const name=`${D.id}-${kind==='work'?'work-orders':'proof'}.pdf`;
  if(silent)return{doc,name};
  const blob=doc.output('blob');
  showPdf(doc,name,blob);
  return{doc,name};
}
function showPdf(doc,name,blob){
  // Download where the browser allows it; always show the pages so it works everywhere.
  download(name,blob);
  const n=doc.getNumberOfPages();
  const url=URL.createObjectURL(blob);
  modal(`<div class="mh"><div><span class="eyebrow">${esc(name)}</span><h3 style="font-size:20px;margin-top:4px">${n} page${n>1?'s':''} ready</h3></div><div class="row" style="flex:0 0 auto"><a class="btn pri" href="${url}" download="${esc(name)}" target="_blank" rel="noopener">Download PDF</a><button class="btn" data-close="1">Close</button></div></div>
    <div class="mb"><iframe src="${url}" title="PDF preview" style="width:100%;height:70vh;border:1px solid var(--line);background:#fff"></iframe><p class="small muted">If the preview is blank in this window, use Download PDF. On rocmemorials.com the file downloads directly.</p></div>`);
}
function download(name,blob){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}catch(e){}}

async function sendToROC(){
  const c=D.contact,miss=[];
  if(!c.first||!c.last)miss.push('your name');if(!c.phone&&!c.email)miss.push('a phone or email');
  if(!people().length)miss.push('at least one name on the stone');
  if(miss.length){toast('Add '+miss.join(', ')+' before sending.');return}
  if(!D.id)D.id=newId();
  toast('Preparing your design…');
  const r=await buildPDF('proof',true);const pdf=r?r.doc.output('datauristring'):null;
  const png=await svgToPng(renderStone({side:'front',bg:'studio',dims:false}),1400);
  const pl=payload(png&&png.src,pdf);
  let sent=false;
  if(CFG.GHL_WEBHOOK_URL){try{const res=await fetch(CFG.GHL_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)});sent=res.ok}catch(e){}}
  commit(true);
  modal(`<div class="mh"><div><span class="eyebrow">Design ${esc(D.id)}</span><h3 style="font-size:22px;margin-top:4px">${sent?'Your design is with ROC.':'Your design is ready to send.'}</h3></div><button class="btn" data-close="1">Close</button></div>
   <div class="mb">${sent?`<div class="note ok">ROC will review your design and call within one business day. Nothing is cut until you sign the final proof.</div>`:`<div class="note warn">This page isn’t connected to ROC’s inbox yet, so nothing was sent. Call ROC at <b style="user-select:all">${CFG.phone}</b> or email <b style="user-select:all">${CFG.email}</b> with your design number and the PDF.${CFG.GHL_WEBHOOK_URL?'':' (Staff: set GHL_WEBHOOK_URL in CFG.)'}</div>`}
   <img src="${png?png.src:''}" alt="Your monument design">
   <div class="row"><button class="btn" data-pdfnow="1">Download proof PDF</button><button class="btn" data-copybrief="1">Copy design summary</button></div>
   ${UI.staff?`<details><summary class="small">Webhook payload (staff)</summary><pre>${esc(JSON.stringify({...pl,preview_png:'(base64 image)',proof_pdf:'(base64 pdf)'},null,2))}</pre></details>`:''}</div>`);
}
function mailProduction(){
  const to=CFG.PRODUCTION.filter(p=>D.route[p.id]).map(p=>p.email);if(!to.length)return toast('Choose at least one production contact.');
  if(!D.id)D.id=newId();
  const body=brief().slice(0,1700)+'\n\nWork orders PDF attached.';
  const href=`mailto:${to.join(',')}?subject=${encodeURIComponent(`ROC work order ${D.id} · ${D.contact.last||D.family}`)}&body=${encodeURIComponent(body)}`;
  modal(`<div class="mh"><h3 style="font-size:20px">Email production</h3><button class="btn" data-close="1">Close</button></div><div class="mb">
   <p class="small" style="margin:0">To: <b class="mono" style="user-select:all">${esc(to.join(', '))}</b></p>
   <pre>${esc(body)}</pre>
   <div class="row"><a class="btn pri" href="${esc(href)}" target="_top">Open in mail app</a><button class="btn" data-copybrief="1">Copy text</button><button class="btn" data-pdfwork="1">Build work orders PDF</button></div>
   <p class="small muted" style="margin:0">Attach the work orders PDF and any portrait photos before sending. If the mail app doesn’t open, copy the text and addresses above.</p></div>`);
}
function copyText(s){const ok=()=>toast('Copied.');try{navigator.clipboard.writeText(s).then(ok).catch(()=>fallbackCopy(s))}catch(e){fallbackCopy(s)}}
function fallbackCopy(s){modal(`<div class="mh"><h3 style="font-size:18px">Copy this text</h3><button class="btn" data-close="1">Close</button></div><div class="mb"><textarea style="min-height:300px" id="cpy">${esc(s)}</textarea></div>`);setTimeout(()=>$('#cpy')?.select(),30)}
function modal(html){const r=$('#modalRoot');r.innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;r.querySelector('.scrim').addEventListener('click',ev=>{if(ev.target.classList.contains('scrim')||ev.target.closest('[data-close]'))r.innerHTML='';if(ev.target.closest('[data-copybrief]'))copyText(brief());if(ev.target.closest('[data-pdfnow]'))buildPDF('proof');if(ev.target.closest('[data-pdfwork]'))buildPDF('work')})}
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function saveFile(){if(!D.id)D.id=newId();const used={};D.els.forEach(e=>{if(e.asset&&ASSETS[e.asset])used[e.asset]=ASSETS[e.asset]});download(`${D.id}-design.json`,new Blob([JSON.stringify({app:'roc-monument-designer',D,ASSETS:used})],{type:'application/json'}));toast(`Saved design ${D.id}.`)}

/* ============================================================ boot */
function renderAll(){railRender();panelRender();toolsRender();inspRender();stageRender();specRender()}
function boot(){
  try{const s=JSON.parse(localStorage.getItem('roc-designer')||'null');if(s&&s.D&&s.D.v===2){D={...newDesign(),...s.D};Object.assign(ASSETS,s.ASSETS||{})}}catch(e){}
  try{const sp=new URLSearchParams(location.search);if(sp.get('staff')==='1')UI.staff=true}catch(e){}
  $('#siteLink').href=CFG.SITE_URL;
  if(!D.els.length)applyPreset(PRESETS[0]);
  commit(true);
  bindStage();bindInspector();bindPanel();
  $('#rail').addEventListener('click',ev=>{const b=ev.target.closest('[data-step]');if(b)goStep(+b.dataset.step)});
  $('#prevBtn').onclick=()=>goStep(UI.step-1);
  $('#nextBtn').onclick=()=>UI.step===STEPS.length-1?sendToROC():goStep(UI.step+1);
  $('#tools').addEventListener('click',ev=>{const b=ev.target.closest('[data-tool]');if(!b)return;const k=b.dataset.tool;
    if(k==='front'||k==='back'){UI.side=k;UI.sel=null}else if(k==='ruler'||k==='grid'||k==='dims')UI[k]=!UI[k];else if(k==='undo')return undo();else if(k==='redo')return redo();
    else if(k.startsWith('bg:'))UI.bg=k.slice(3);else if(k==='zin')return setZoom(UI.zoom*1.25);else if(k==='zout')return setZoom(UI.zoom/1.25);else if(k==='fit')return setZoom(1);
    toolsRender();inspRender();stageRender();if(STEPS[UI.step].id==='back'||STEPS[UI.step].id==='art')panelRender()});
  $('#specbar').addEventListener('input',ev=>{const t=ev.target;if(!t.dataset.spec)return;const v=t.tagName==='SELECT'?t.value:parseFloat(t.value);if(t.tagName!=='SELECT'&&!(v>0))return;setPath(t.dataset.spec,v);afterChange(t.dataset.spec,false);if(UI.step===2)panelRender()});
  $('#specbar').addEventListener('change',ev=>{specRender()});
  $('#specbar').addEventListener('click',ev=>{const b=ev.target.closest('[data-specbtn]');if(!b)return;if(b.dataset.specbtn==='base')D.base.on=true;else D.sub.on=true;afterChange('base',true)});
  $('#staffBtn').onclick=()=>{
    if(!UI.staff&&CFG.STAFF_PIN){modal(`<div class="mh"><h3 style="font-size:18px">ROC staff view</h3><button class="btn" data-close="1">Close</button></div><div class="mb"><form id="pinf" class="row"><input type="password" id="pin" placeholder="Staff PIN" autocomplete="off"><button class="btn pri" type="submit" style="flex:0">Unlock</button></form></div>`);
      $('#pinf').onsubmit=e=>{e.preventDefault();if($('#pin').value===CFG.STAFF_PIN){UI.staff=true;$('#modalRoot').innerHTML='';staffSync()}else toast('That PIN is not correct.')};return}
    UI.staff=!UI.staff;staffSync()};
  $('#saveBtn').onclick=saveFile;
  $('#openBtn').onclick=()=>$('#fileOpen').click();
  $('#fileOpen').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.D)throw 0;D={...newDesign(),...j.D};Object.assign(ASSETS,j.ASSETS||{});UI.sel=null;commit(true);renderAll();toast(`Opened ${D.id||'design'}.`)}catch(e){toast('That file is not a ROC design file.')}};rd.readAsText(f);ev.target.value=''};
  $('#photoIn').onchange=ev=>{onPhoto(ev.target.files[0]);ev.target.value=''};
  staffSync();
  renderAll();
  const ready=()=>{FONTS_READY=true;for(const k in CAPCACHE)delete CAPCACHE[k];if(D.autoLayout)autoArrange(true);renderAll()};
  if(document.fonts&&document.fonts.ready){Promise.all(FONTS.map(f=>document.fonts.load(`40px ${f.css}`).catch(()=>{}))).then(()=>document.fonts.ready).then(ready)}else ready();
}
function staffSync(){$('#staffBtn').setAttribute('aria-pressed',UI.staff);panelRender()}
boot();

</script>
