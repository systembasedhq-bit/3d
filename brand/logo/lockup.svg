<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" width="560" height="100">
  <!-- Horizontal lockup. Text uses Michroma: outline the text in Figma/Illustrator before sending to print. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9dce0"/>
      <stop offset="0.55" stop-color="#8a8f97"/>
      <stop offset="1" stop-color="#f2f3f5"/>
    </linearGradient>
  </defs>
  <g transform="translate(10 18) scale(0.64)" fill="url(#chrome)">
    <rect x="4" y="4" width="42" height="42" rx="7"/>
    <rect x="54" y="4" width="42" height="42" rx="7"/>
    <rect x="4" y="54" width="42" height="42" rx="7"/>
    <rect x="54" y="54" width="42" height="42" rx="7"/>
    <circle cx="36" cy="36" r="4.5" fill="#0a0a0b"/>
  </g>
  <text x="104" y="63" fill="url(#chrome)" font-family="Michroma, Eurostile, sans-serif" font-size="30" letter-spacing="5">SYSTEM BASED</text>
</svg>
